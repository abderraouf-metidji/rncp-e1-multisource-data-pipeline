services:
  postgres:
    image: postgres:16-alpine
    container_name: rncp-c1-postgres
    environment:
      POSTGRES_USER: rncp
      POSTGRES_PASSWORD: rncp
      POSTGRES_DB: countries
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rncp -d countries"]
      interval: 5s
      timeout: 5s
      retries: 10
